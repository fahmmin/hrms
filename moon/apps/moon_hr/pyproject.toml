[project]
name = "moon_hr"
authors = [{ name = "Moon Exchange", email = "hr@moon.exchange" }]
description = "Moon Exchange extensions for Frappe HR: work hours, CRM, About page and demo data"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<18.0.0"
