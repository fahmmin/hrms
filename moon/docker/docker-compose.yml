# Moon Exchange HRMS - one-command local demo / single-server deployment.
#
#   cd moon
#   docker compose -f docker/docker-compose.yml up -d --build
#   open http://localhost:8080   (Administrator / admin)
#
# The first start builds the image and seeds demo data (10-20 min on a laptop).
# Settings can be overridden in docker/.env (see .env.example).

x-app: &app
  image: moon-hrms:${MOON_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      ERPNEXT_IMAGE: ${ERPNEXT_IMAGE:-frappe/erpnext:v16.53.0}
      HRMS_REF: ${HRMS_REF:-v16.53.1}
  restart: unless-stopped
  networks: [moon]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    networks: [moon]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --innodb-snapshot-isolation=OFF
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-moon-db-root}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [moon]

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [moon]
    volumes:
      - redis-queue-data:/data

  # Writes common_site_config.json (db/redis hosts) and exits.
  configurator:
    <<: *app
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
    depends_on:
      db: { condition: service_healthy }

  # Creates the site on first run, migrates on later runs, seeds demo data once.
  create-site:
    <<: *app
    restart: "no"
    entrypoint: ["bash", "/home/frappe/bootstrap.sh"]
    environment:
      SITE_NAME: ${SITE_NAME:-moon.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-moon-db-root}
      SEED_DEMO: ${SEED_DEMO:-1}
      HTTP_PORT: ${HTTP_PORT:-8080}
    depends_on:
      configurator: { condition: service_completed_successfully }
      redis-cache: { condition: service_started }
      redis-queue: { condition: service_started }

  backend:
    <<: *app
    depends_on:
      create-site: { condition: service_completed_successfully }

  websocket:
    <<: *app
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      create-site: { condition: service_completed_successfully }

  queue:
    <<: *app
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      create-site: { condition: service_completed_successfully }

  scheduler:
    <<: *app
    command: ["bench", "schedule"]
    depends_on:
      create-site: { condition: service_completed_successfully }

  frontend:
    <<: *app
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-moon.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  moon:
